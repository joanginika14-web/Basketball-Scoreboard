<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Basketball Scoreboard</title>
<link rel="stylesheet" href="styles.css">
</head>

<body>

<!-- LOGO -->
<div class="logo">
    <img src="basketball.avif" alt="basketball picture">
</div>

<!-- SCOREBOARD -->
<div class="container">

    <!-- HOME TEAM -->
    <div class="team">
        <p class="team-title">HOME</p>
        <p class="score" id="score1">0</p>

        <div class="buttons">
            <button onclick="home1()">+1</button>
            <button onclick="home2()">+2</button>
            <button onclick="home3()">+3</button>
        </div>
    </div>

    <!-- GUEST TEAM -->
    <div class="team">
        <p class="team-title">GUEST</p>
        <p class="score" id="score2">0</p>

        <div class="buttons">
            <button onclick="guest1()">+1</button>
            <button onclick="guest2()">+2</button>
            <button onclick="guest3()">+3</button>
        </div>
    </div>

</div>

<!-- RESET BUTTON -->
<div class="reset">
    <button id="reset-btn" onclick="reset()">RESET</button>
</div>

<script src="index.js"></script>

</body>
</html>
